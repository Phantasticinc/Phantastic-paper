    />
    <!-- Apply the saved theme before first paint (localStorage key: phantastic-theme). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("phantastic-theme");
          if (t !== "light" && t !== "dark") t = "dark";
          var el = document.documentElement;
          el.classList.remove("light", "dark");
          el.classList.add(t);
          el.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "light" ? "#f3efe6" : "#0b0c0e");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg font-sans text-fg">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
